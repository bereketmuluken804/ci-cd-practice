name: Deployment pipline

on:
    push:
        branch:
            - main

jobs:
    deployjobs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: "24"
            - name: Install dependencies
              run: npm install
            - name: check style
              run: npm run eslint
            - name: build 
              run: npm run build
            - name: Run tests
              run: npm run test
